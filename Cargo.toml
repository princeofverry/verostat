[package]
name = "verostat"
version = "0.3.0"
edition = "2021"
authors = ["VeroStat Contributors"]
description = "Lightweight Windows system-tray utility"

[dependencies]
sysinfo = "0.33"
tray-icon = "0.19"
muda = "0.15"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_SystemServices",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
